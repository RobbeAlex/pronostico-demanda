[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collins-demand-forecast"
version = "3.0.0"
description = "Sistema Integral de Pronóstico de la Demanda Farmacéutica para Grupo Collins (Proyecto Integrador 3 - UDG)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Roberto Alejandro Chagra Martínez" }
]
keywords = [
    "time-series",
    "forecasting",
    "pharma-demand",
    "prophet",
    "sarimax",
    "random-forest",
    "bayesian-inference",
    "streamlit",
    "sqlite",
    "mongodb"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.5",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0"
]

[project.scripts]
collins-forecast = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
